version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: eventops-postgres
    restart: always
    environment:
      POSTGRES_USER: eventops_user
      POSTGRES_PASSWORD: eventops_password
      POSTGRES_DB: eventops_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/database/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventops_user -d eventops_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: eventops-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  backend:
    build: .
    container_name: eventops-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://eventops_user:eventops_password@postgres:5432/eventops_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: eventops_super_secret_jwt_key_2026_secure
      QR_HMAC_SECRET: eventops_qr_hmac_secret_cryptographic_pass_2026
    ports:
      - "5000:5000"

volumes:
  pgdata:
  redisdata:
