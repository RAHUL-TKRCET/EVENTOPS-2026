name: Registration hotfix

on:
  push:
    branches:
      - fix/public-registration-data-conflict

permissions:
  contents: write

jobs:
  apply-fix:
    if: ${{ !contains(github.event.head_commit.message, '[registration-hotfix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply FK ordering fix and regression coverage
        run: |
          python - <<'PY'
          from pathlib import Path
          auth = Path('backend/app/api/v1/auth.py')
          text = auth.read_text()
          old = '''    db.add(user)\n    db.add(member)\n    try:\n        db.flush()\n'''
          new = '''    db.add(user)\n    try:\n        # Persist the parent user before inserting the event_members row.\n        # PostgreSQL enforces event_members.user_id -> users.id, and the\n        # models intentionally do not declare a SQLAlchemy relationship that\n        # would provide this dependency ordering automatically.\n        db.flush()\n        db.add(member)\n        db.flush()\n'''
          if old not in text:
              raise SystemExit('Expected public registration block was not found')
          auth.write_text(text.replace(old, new, 1))

          test = Path('backend/tests/test_registration.py')
          text = test.read_text()
          text = text.replace('from sqlalchemy import create_engine\n', 'from sqlalchemy import create_engine, text\n', 1)
          marker = '''    TestingSessionLocal = sessionmaker(autocommit=False, autoflush=False, bind=test_engine)\n'''
          replacement = '''    with test_engine.connect() as connection:\n        connection.execute(text("PRAGMA foreign_keys=ON"))\n    TestingSessionLocal = sessionmaker(autocommit=False, autoflush=False, bind=test_engine)\n'''
          if marker not in text:
              raise SystemExit('Expected test session setup was not found')
          test.write_text(text.replace(marker, replacement, 1))
          PY
          rm .github/workflows/registration-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/api/v1/auth.py backend/tests/test_registration.py .github/workflows/registration-hotfix.yml
          git commit -m "fix: order public participant persistence [registration-hotfix]"
          git push origin HEAD:fix/public-registration-data-conflict
