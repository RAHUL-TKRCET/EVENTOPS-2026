[project]
name = "eventops-backend"
version = "2.0.0"
description = "EVENTOPS-2026 Core FastAPI Backend - RBAC, QR Cryptography & Google OR-Tools CP-SAT"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.32",
    "psycopg2-binary>=2.9.9",
    "pyjwt>=2.9.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1,<4.1.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    "ortools>=9.10.4067",
    "redis>=5.0.8",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "email-validator>=2.0.0",
]

[tool.fastapi]
entrypoint = "main:app"

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

